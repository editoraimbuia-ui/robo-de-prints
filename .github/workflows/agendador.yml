name: Robô de Prints Automático

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Executar robô de captura
        run: python main.py

      - name: Salvar Prints como Comprovantes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-capturados
          path: prints/
