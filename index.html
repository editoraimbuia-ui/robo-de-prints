<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Prints - Painel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-lg border border-slate-700">
    <h1 class="text-2xl font-bold text-sky-400 mb-1 flex items-center gap-2">
      🚀 Novo Cadastro de Campanha
    </h1>
    <p class="text-sm text-slate-400 mb-6">Cadastre a campanha para o robô capturar os prints automaticamente.</p>

    <form id="campanhaForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Nome do Cliente / Campanha</label>
        <input type="text" id="cliente" required placeholder="Ex: Prefeitura de Corbélia" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">URL do Portal/Site</label>
        <input type="url" id="url" required value="https://gazetadoparana.com.br" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Posições do Banner (Selecione uma ou mais)</label>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 1" class="rounded accent-sky-500">
            <span>Espaço 1 (Painel Topo)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 2" class="rounded accent-sky-500">
            <span>Espaço 2 (Banner Principal)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 3" class="rounded accent-sky-500">
            <span>Espaço 3 (Meio)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 4" class="rounded accent-sky-500">
            <span>Espaço 4 (Últimas Notícias)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 5" class="rounded accent-sky-500">
            <span>Espaço 5 (Rodapé)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750">
            <input type="checkbox" name="posicao" value="Espaço 6" class="rounded accent-sky-500">
            <span>Espaço 6 (Matéria A)</span>
          </label>
          <label class="flex items-center space-x-2 bg-slate-900 p-2.5 rounded border border-slate-700 cursor-pointer hover:bg-slate-750 col-span-2">
            <input type="checkbox" name="posicao" value="Espaço 7" class="rounded accent-sky-500">
            <span>Espaço 7 (Matéria B)</span>
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Data de Início</label>
          <input type="date" id="data_inicio" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Data de Término</label>
          <input type="date" id="data_fim" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-sky-500 text-white">
        </div>
      </div>

      <button type="submit" id="btnSalvar" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 mt-2">
        Cadastrar Campanha
      </button>
    </form>
  </div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbziOURSlbOgz2vISG8u7FfWMRwe_X4YCICY_e3YQjGF3D_t7AJ7zsWfxSeANOr3NL0N4w/exec";

    document.getElementById("campanhaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnSalvar");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const cliente = document.getElementById("cliente").value;
      const url = document.getElementById("url").value;
      const data_inicio = document.getElementById("data_inicio").value;
      const data_fim = document.getElementById("data_fim").value;

      const posicoes = Array.from(document.querySelectorAll('input[name="posicao"]:checked')).map(cb => cb.value);

      if (posicoes.length === 0) {
        alert("Selecione pelo menos um Espaço.");
        btn.innerText = "Cadastrar Campanha";
        btn.disabled = false;
        return;
      }

      for (const pos of posicoes) {
        const payload = { cliente, url, posicao: pos, data_inicio, data_fim, status: "Ativo" };
        await fetch(WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      }

      alert("Campanha(s) cadastrada(s) com sucesso!");
      document.getElementById("campanhaForm").reset();
      btn.innerText = "Cadastrar Campanha";
      btn.disabled = false;
    });
  </script>
</body>
</html>
